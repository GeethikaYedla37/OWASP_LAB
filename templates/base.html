<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Student Portal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}" aria-label="Student Portal home">
      <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
        <path d="M4 8.5c7.2 0 12.8 2 18 6.2v23C16.8 33.5 11.2 31.5 4 31.5v-23Z"></path>
        <path d="M40 8.5c-7.2 0-12.8 2-18 6.2v23c5.2-4.2 10.8-6.2 18-6.2v-23Z"></path>
      </svg>
      <span>Student Portal</span>
    </a>

    {% if current_user %}
      <nav class="primary-nav" aria-label="Primary navigation">
        <a class="{% if request.endpoint == 'student' %}active{% endif %}" href="{{ url_for('student') }}">Student</a>
        <a class="{% if request.endpoint == 'admin' %}active{% endif %}" href="{{ url_for('admin') }}">Admin</a>
      </nav>
    {% endif %}

    <div class="header-actions">
      <span class="mode-indicator mode-{{ lab_mode }}" data-testid="mode-indicator">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          {% if is_vulnerable %}
            <path d="M12 3 2.8 20h18.4L12 3Zm0 5.2v5.7m0 2.8v.1"></path>
          {% else %}
            <path d="M12 3 4.8 6v5.2c0 4.8 2.9 8.2 7.2 9.8 4.3-1.6 7.2-5 7.2-9.8V6L12 3Zm-3 8.8 2 2 4.3-4.4"></path>
          {% endif %}
        </svg>
        {{ lab_mode|upper }} MODE
      </span>

      {% if current_user %}
        <form action="{{ url_for('logout') }}" method="post">
          <button class="button button-secondary button-small" type="submit">Log out</button>
        </form>
      {% endif %}
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    {% if current_user %}
      <a href="{{ url_for('debug_error') }}">Trigger demo error</a>
      <span aria-hidden="true">·</span>
    {% endif %}
    <span>Local training application</span>
  </footer>
</body>
</html>
